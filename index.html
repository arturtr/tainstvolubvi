<script>
// Count the visit (with its UTM tags) in Yandex Metrika, then leave for Taplink with the same query.
(function () {
  var TARGET = "https://taplink.cc/tainstvolubvi";
  var COUNTER = 114580701;
  var url = TARGET + location.search;
  var left = false;
  function leave() {
    if (!left) { left = true; location.replace(url); }
  }
  // An ad blocker or a weak signal must not keep the visitor here.
  setTimeout(leave, 1500);
  window.ym = window.ym || function () { (window.ym.a = window.ym.a || []).push(arguments); };
  window.ym.l = Date.now();
  var tag = document.createElement("script");
  tag.async = true;
  tag.src = "https://mc.yandex.ru/metrika/tag.js?id=" + COUNTER;
  document.head.appendChild(tag);
  ym(COUNTER, "init", { defer: true, ssr: true, clickmap: false, trackLinks: false, webvisor: false });
  ym(COUNTER, "hit", location.href, { title: document.title, referer: document.referrer, callback: leave });
})();
</script>
<style>
  :root { color-scheme: light dark; --bg: #faf7f2; --fg: #3b2f2a; --accent: #a5772f; --track: rgba(165, 119, 47, 0.2); }

  .spinner {
    width: 56px; height: 56px; border-radius: 50%;
    border: 5px solid var(--track); border-top-color: var(--accent);
    animation: spin 0.9s linear infinite;
  }
  p { margin: 0; }
  .fallback { font-size: 18px; opacity: 0; animation: show 0.3s ease 2.5s forwards; }
  .fallback a { color: var(--accent); }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes show { to { opacity: 1; } }
</style>
